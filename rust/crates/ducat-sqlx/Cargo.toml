[package]
name = "ducat-sqlx"
version.workspace = true
description = "Money columns for sqlx: exact Postgres NUMERIC and BIGINT amounts, ducat's money composite type, and MySQL and SQLite column shapes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ducat-sqlx"
readme = "README.md"
keywords = ["money", "sqlx", "postgres", "mysql", "sqlite"]
categories = ["finance", "database"]
# only what builds and documents the crate: no tests (they read the repository's spec/ and data/),
# generators or proptest regressions
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = ["postgres"]
## Postgres: exact NUMERIC (binary and text) and BIGINT amounts, and the `ducat_money` composite type.
postgres = ["sqlx/postgres"]
## MySQL and MariaDB: DECIMAL and BIGINT amounts.
mysql = ["sqlx/mysql"]
## SQLite: TEXT decimal and INTEGER minor-unit amounts.
sqlite = ["sqlx/sqlite"]

[dependencies]
ducat = { path = "../ducat", version = "0.1.0", default-features = false, features = ["std"] }
ducat-sql-core = { path = "../ducat-sql-core", version = "0.1.0" }
sqlx = { version = "0.8", default-features = false }

[dev-dependencies]
ducat = { path = "../ducat", version = "0.1.0", default-features = false, features = ["std", "iso", "proptest"] }
proptest = { version = "1.6", default-features = false, features = ["std"] }
# reading the spec's vectors
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
