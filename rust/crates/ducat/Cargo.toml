[package]
name = "ducat"
version = "0.0.0"
description = "Exact, typed money: a Rust port of @ducatjs/money"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std", "iso", "serde", "allocate", "cash", "tax", "fixed", "exact", "convert", "finance", "excel", "policy", "pricing", "math", "currencies", "historic", "territories", "crypto", "stripe", "adyen", "checkout", "paypal", "braintree", "klarna"]
## The standard library. The core needs only `alloc`; `Error` implements `core::error::Error` either way.
std = ["serde?/std", "num-bigint/std", "num-integer/std", "num-traits/std"]
## A zero-sized marker type for every ISO 4217 currency (`ducat::iso::Eur`).
iso = []
## Allocation, splits, instalments, schedules and chunks (`ducat::allocate`).
allocate = []
## Cash rounding: to an increment (`round_to_increment`), and by the cash-rounding rules
## (`ducat::cash`: `cash_rule`, `cash_round`, `cash_unit`, `cash_digits`; `cash_policy` with `policy`).
cash = []
## ISO 4217 numeric codes both ways, and the size of a minor unit (`ducat::currencies`).
currencies = []
## Withdrawn ISO 4217 codes and non-ISO ones, with the exponent each had (`ducat::historic`).
historic = []
## The currencies each territory uses and used, from CLDR (`ducat::territories`).
territories = []
## Crypto currencies and tokens, and base units (`ducat::crypto`).
crypto = []
## Stripe's amounts, to and from its API (`ducat::processors::stripe`).
stripe = []
## Adyen's amounts (`ducat::processors::adyen`).
adyen = []
## Checkout.com's amounts (`ducat::processors::checkout`).
checkout = []
## PayPal's amounts, decimal strings (`ducat::processors::paypal`).
paypal = []
## Braintree's amounts, decimal strings (`ducat::processors::braintree`).
braintree = []
## Klarna's amounts, ISO minor units (`ducat::processors::klarna`).
klarna = []
## `ExactMoney`, exact rational amounts that round once at the end (`ducat::exact`).
exact = []
## Exchange rates: `Rate`, inverses, chains and conversions (`ducat::convert`).
convert = ["exact"]
## Percentages, discounts, and adding and extracting tax (`ducat::tax`).
tax = []
## `Fixed`, an exact decimal without a currency (`ducat::fixed`).
fixed = []
## Day counts, interest, loan and savings schedules, discounted sums, Excel's NPV and IRR, and
## proration, in exact arithmetic (`ducat::finance`).
finance = ["allocate"]
## Rounding policies: a scale, an increment and a mode as one value, accepted wherever a mode is
## (`ducat::policy`).
policy = []
## Retail price endings, and tiered and volume pricing (`ducat::pricing`).
pricing = ["exact"]
## Averages, shares, integral division, trimming the scale and the complement of a ratio
## (`ducat::math`).
math = []
## `Serialize` and `Deserialize` as `{"amount":"12.34","currency":"EUR"}`.
serde = ["dep:serde"]
## Functions named after Excel's, with its arguments and conventions (`ducat::excel`).
excel = ["finance", "exact"]

[dependencies]
# amounts, ratios and weights beyond i128; private behind ducat::Int
num-bigint = { version = "0.4.6", default-features = false }
num-integer = { version = "0.1.46", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
serde = { version = "1.0.219", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }
serde_json = "1.0.140"

[[test]]
name = "spec"
harness = false
