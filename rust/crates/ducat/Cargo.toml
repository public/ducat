[package]
name = "ducat"
version = "0.0.0"
description = "Exact, typed money: a Rust port of @ducatjs/money"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std", "iso", "serde", "allocate", "cash", "tax", "fixed"]
## The standard library. The core needs only `alloc`; `Error` implements `core::error::Error` either way.
std = ["serde?/std", "num-bigint/std", "num-integer/std", "num-traits/std"]
## A zero-sized marker type for every ISO 4217 currency (`ducat::iso::Eur`).
iso = []
## Allocation, splits, instalments, schedules and chunks (`ducat::allocate`).
allocate = []
## Rounding to an increment (`round_to_increment`), for cash.
cash = []
## Percentages, discounts, and adding and extracting tax (`ducat::tax`).
tax = []
## `Fixed`, an exact decimal without a currency (`ducat::fixed`).
fixed = []
## `Serialize` and `Deserialize` as `{"amount":"12.34","currency":"EUR"}`.
serde = ["dep:serde"]

[dependencies]
# amounts, ratios and weights beyond i128; private behind ducat::Int
num-bigint = { version = "0.4.6", default-features = false }
num-integer = { version = "0.1.46", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
serde = { version = "1.0.219", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }
serde_json = "1.0.140"

[[test]]
name = "spec"
harness = false
