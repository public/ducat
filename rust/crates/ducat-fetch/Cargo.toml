[package]
name = "ducat-fetch"
version.workspace = true
description = "Fetchers for published reference rates (ECB, Bank of Canada) for ducat: ducat's /fetch, sans-IO with an optional blocking ureq transport"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ducat-fetch"
readme = "README.md"
keywords = ["money", "exchange-rates", "ecb", "currency", "fetch"]
categories = ["finance", "web-programming::http-client"]
# only what builds and documents the crate: no tests (they read the repository's spec/ and data/),
# generators or proptest regressions
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = ["ureq"]
## `UreqTransport`: a blocking HTTPS transport on ureq 3 with rustls on ring (no C toolchain beyond
## `cc`, no async runtime). Without it the crate is the sans-IO core and the `Transport` trait.
ureq = ["dep:ureq"]

[dependencies]
ducat = { path = "../ducat", version = "0.1.0", default-features = false, features = ["std", "ecb", "boc"] }
# `rustls` is ureq's rustls-no-provider + _ring (rustls/ring) + rustls-webpki-roots: no aws-lc-rs,
# no gzip, no native-tls, no cookies or JSON.
ureq = { version = "3.0", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
ducat = { path = "../ducat", version = "0.1.0", default-features = false, features = ["std", "ecb", "boc", "iso"] }
