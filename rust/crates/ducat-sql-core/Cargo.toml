[package]
name = "ducat-sql-core"
version.workspace = true
description = "An internal detail of ducat-sqlx and ducat-diesel, with no stability promise: use those crates. Their shared core: exact decimals, column sizes, Postgres NUMERIC digits and ducat's money composite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ducat-sql-core"
readme = "README.md"
keywords = ["money", "decimal", "numeric", "postgres"]
categories = ["finance", "database"]
# only what builds and documents the crate: no tests (they read the repository's spec/ and data/),
# generators or proptest regressions
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
ducat = { path = "../ducat", version = "0.1.0", default-features = false, features = ["std"] }
