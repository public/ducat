[package]
name = "ducat-words"
version.workspace = true
description = "Amounts and numbers in words for ducat, by CLDR's rule-based number formats (RBNF), with its own interpreter and no ICU"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ducat-words"
readme = "README.md"
keywords = ["money", "words", "spellout", "cldr", "rbnf"]
categories = ["finance", "internationalization", "localization", "value-formatting", "no-std"]
# only what builds and documents the crate: no tests (they read the repository's spec/ and data/),
# generators or proptest regressions
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = ["std", "en", "de", "fr", "es", "it", "nl", "pt"]
## The standard library; the crate needs only `alloc`.
std = ["ducat/std"]
## English (`ducat_words::ENGLISH`).
en = []
## German (`ducat_words::GERMAN`).
de = []
## French (`ducat_words::FRENCH`).
fr = []
## Spanish (`ducat_words::SPANISH`).
es = []
## Italian (`ducat_words::ITALIAN`).
it = []
## Dutch (`ducat_words::DUTCH`).
nl = []
## Portuguese (`ducat_words::PORTUGUESE`).
pt = []

[dependencies]
ducat = { path = "../ducat", version = "0.1.0", default-features = false }

[dev-dependencies]
ducat = { path = "../ducat", version = "0.1.0", features = ["iso"] }
serde_json = "1.0.140"
proptest = { version = "1.6", default-features = false, features = ["std"] }
