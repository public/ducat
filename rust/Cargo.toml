[workspace]
resolver = "3"
members = ["crates/ducat"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/public/ducat"

# Tests (the conformance runner above all, whose XNPV and XIRR tables do large-integer arithmetic)
# build with light optimisation; debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
