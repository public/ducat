[workspace]
resolver = "3"
members = ["crates/ducat", "crates/ducat-words", "crates/ducat-format"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/public/ducat"

# Tests build the workspace's own crates (each library and its `it` test binary) unoptimised, which
# keeps an incremental `cargo test` quick: ducat's `it` crate is the biggest unit of that build, and
# compiles much faster without optimisation. Profile overrides are per package, not per target, so the
# libraries and their tests share one opt-level. The dependencies, above all num-bigint (the
# conformance runner's XNPV and XIRR tables do large-integer arithmetic), build lightly optimised;
# they rarely rebuild. Debug assertions and overflow checks stay on throughout.
[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 1
