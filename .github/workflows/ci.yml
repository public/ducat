name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly deep property run
  workflow_dispatch:
    inputs:
      seed:
        description: fast-check seed for the deep run (empty for a fresh one)
        required: false

permissions:
  contents: read

# by event as well as ref, so a push to main never queues behind the nightly deep run
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, format, types, generated data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the PR title becomes the squash commit's subject
      - name: Pull request title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/check-commit-msg.sh --subject "$TITLE"
      # warnings fail too (--deny-warnings)
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      # the release workflow builds with these tsconfigs, so a build error must fail here first
      - run: pnpm build
      # the built package as apps bundle it: a wrong "sideEffects" drops the methods' install
      - run: node scripts/bundle-check.mjs
      # the packed package's types from CommonJS (node10), nodenext and bundler projects
      - run: pnpm check:consumers
      - run: pnpm gen:check
      - name: Python decimal reference vectors are up to date
        run: pnpm vectors:check
      - run: pnpm run --if-present size

  node:
    name: vitest on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24.x, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:dectest
      - run: pnpm test
        env:
          DUCAT_REQUIRE_DECTEST: '1'

  runtimes:
    name: Bun, Deno and engine shells
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: pnpm install --frozen-lockfile
      - name: Install SpiderMonkey and JavaScriptCore shells
        run: pnpm dlx jsvu@3.0.6 --os=linux64 --engines=spidermonkey,javascriptcore
      - run: pnpm test:runtimes
        env:
          BUN: bun
          DENO: deno

  deep:
    name: deep property run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:dectest
      - run: pnpm test:deep
        env:
          DUCAT_REQUIRE_DECTEST: '1'
          DUCAT_SEED: ${{ inputs.seed }}

  databases:
    name: SQL helpers on Postgres, MySQL and SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # pinned by digest (postgres 18.6); update the tag and digest together
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: ducat
          POSTGRES_DB: ducat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        # pinned by digest (mysql 8.4.13); update the tag and digest together
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: ducat
          MYSQL_DATABASE: ducat
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pducat" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DUCAT_PG_URL: postgres://postgres:ducat@127.0.0.1:5432/ducat
      DUCAT_MYSQL_URL: mysql://root:ducat@127.0.0.1:3306/ducat
      DUCAT_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  browsers:
    name: Chromium, Firefox and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser

  mutation:
    name: mutation testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the decTest oracle kills mutants the other tests miss
      - run: pnpm fetch:dectest
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  compare:
    name: cross-library battery and comparison tables
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      # only the compared libraries and esbuild: the batteries bundle ducat from source, which has
      # no dependencies, and none of the root's dev tooling is needed
      - run: pnpm install --frozen-lockfile --filter @ducatjs/compare --prod
      - name: Bundle the money and fixed-point batteries
        working-directory: compare
        run: |
          node build.mjs battery/run.ts out/battery.mjs
          node build.mjs fixed/run.ts out/fixed-battery.mjs
      - name: Run both on Node, Bun and Deno
        working-directory: compare
        run: |
          for battery in battery fixed-battery; do
            node out/$battery.mjs > out/$battery-node.json
            bun out/$battery.mjs > out/$battery-bun.json
            # monetra reads NODE_ENV; nothing else needs a permission
            deno run --no-config --no-prompt --allow-env=NODE_ENV out/$battery.mjs > out/$battery-deno.json
          done
      - name: Same outcomes as the committed results, and ducat passes every vector
        working-directory: compare
        run: |
          node battery/check.ts results/battery.json \
            out/battery-node.json out/battery-bun.json out/battery-deno.json
          node battery/check.ts results/fixed-battery.json \
            out/fixed-battery-node.json out/fixed-battery-bun.json out/fixed-battery-deno.json
      - name: Comparison tables are up to date
        working-directory: compare
        run: node tables.ts --check

  proofs:
    name: Lean proofs and generated kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the proofs land separately; until they do, every later step is skipped
      - id: proofs
        name: Are there proofs to build?
        run: |
          if [ -f proofs/lean-toolchain ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.proofs.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.proofs.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install elan 4.2.4 (the Lean toolchain itself comes from proofs/lean-toolchain)
        if: steps.proofs.outputs.present == 'true'
        # the release publishes no checksum file; this hash is of the release asset, pinned here
        run: |
          # GitHub release downloads return 504s for minutes at a time: retry with a long backoff
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 20 -o elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          rm elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the Lean toolchain
        if: steps.proofs.outputs.present == 'true'
        # elan would download it on first use with no retry; releases.lean-lang.org has transient outages
        run: |
          toolchain="$(cat proofs/lean-toolchain)"
          for i in 1 2 3 4 5; do
            elan toolchain install "$toolchain" && exit 0
            sleep $((20 * i))
          done
          exit 1
      # only the prebuilt Mathlib: .lake/packages is large and cheap to rebuild from it
      - if: steps.proofs.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ hashFiles('proofs/lake-manifest.json', 'proofs/lean-toolchain') }}
      - name: Fetch prebuilt Mathlib
        if: steps.proofs.outputs.present == 'true'
        working-directory: proofs
        run: lake exe cache get
      - if: steps.proofs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Rebuild the proofs and check the generated kernel byte for byte
        if: steps.proofs.outputs.present == 'true'
        run: pnpm gen:kernel:check
        env:
          DUCAT_GENERATED_DIR: ${{ runner.temp }}/generated
      # what the proofs generated, when it differs from the committed files: lets a change to the
      # models be committed from a machine without Lean
      - name: Upload the generated files that differ
        if: failure() && steps.proofs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-files
          path: ${{ runner.temp }}/generated
          retention-days: 7
          if-no-files-found: ignore
