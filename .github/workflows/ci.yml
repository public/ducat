name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly deep property run
  workflow_dispatch:
    inputs:
      seed:
        description: fast-check seed for the deep run (empty for a fresh one)
        required: false

permissions:
  contents: read

# by event as well as ref, so a push to main never queues behind the nightly deep run
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, format, types, generated data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm gen:check
      - run: pnpm run --if-present size

  node:
    name: vitest on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24.x, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  runtimes:
    name: Bun, Deno and engine shells
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: pnpm install --frozen-lockfile
      - name: Install SpiderMonkey and JavaScriptCore shells
        run: pnpm dlx jsvu@3.0.6 --os=linux64 --engines=spidermonkey,javascriptcore
      - run: pnpm test:runtimes
        env:
          BUN: bun
          DENO: deno

  deep:
    name: deep property run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deep
        env:
          DUCAT_SEED: ${{ inputs.seed }}

  compare:
    name: cross-library battery and comparison tables
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: pnpm install --frozen-lockfile
      - name: Bundle the battery
        working-directory: compare
        run: node build.mjs battery/run.ts out/battery.mjs
      - name: Run it on Node, Bun and Deno
        working-directory: compare
        run: |
          node out/battery.mjs > out/battery-node.json
          bun out/battery.mjs > out/battery-bun.json
          deno run -A --no-config out/battery.mjs > out/battery-deno.json
      - name: Same outcomes as the committed results, and ducat passes every vector
        working-directory: compare
        run: node battery/check.ts out/battery-node.json out/battery-bun.json out/battery-deno.json
      - name: Comparison tables are up to date
        working-directory: compare
        run: node tables.ts --check

  proofs:
    name: Lean proofs and generated kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the proofs land separately; until they do, every later step is skipped
      - id: proofs
        name: Are there proofs to build?
        run: |
          if [ -f proofs/lean-toolchain ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.proofs.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.proofs.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install elan 4.2.4 (the Lean toolchain itself comes from proofs/lean-toolchain)
        if: steps.proofs.outputs.present == 'true'
        # the release publishes no checksum file; this hash is of the release asset, pinned here
        run: |
          curl -sSfLo elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          rm elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # only the prebuilt Mathlib: .lake/packages is large and cheap to rebuild from it
      - if: steps.proofs.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ hashFiles('proofs/lake-manifest.json', 'proofs/lean-toolchain') }}
      - name: Fetch prebuilt Mathlib
        if: steps.proofs.outputs.present == 'true'
        working-directory: proofs
        run: lake exe cache get
      - if: steps.proofs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Rebuild the proofs and check the generated kernel byte for byte
        if: steps.proofs.outputs.present == 'true'
        run: pnpm gen:kernel:check
