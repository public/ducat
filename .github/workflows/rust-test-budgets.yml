name: Rust test budgets

# Measurement only: how much of their wall-clock budgets the Rust port's timed tests use, at -j1 and
# at cargo's default parallelism. Each timed test runs 5 times with DUCAT_REPORT_BUDGETS set; the
# table is each test's worst run.
on:
  pull_request:
    paths:
      - '.github/workflows/rust-test-budgets.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  budgets:
    name: test budgets (CARGO_BUILD_JOBS=${{ matrix.jobs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs: ['1', default]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - if: matrix.jobs != 'default'
        run: echo "CARGO_BUILD_JOBS=${{ matrix.jobs }}" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked --no-run
      - name: run the timed tests 5 times
        env:
          DUCAT_REPORT_BUDGETS: '1'
        run: |
          set -o pipefail
          for run in 1 2 3 4 5; do
            echo "run $run"
            cargo test -p ducat --test it --locked -- --exact --nocapture \
              regressions::hundred_thousand_digits
            cargo test -p ducat-words --test it --locked -- --exact --nocapture \
              words::rules_that_branch_past_the_work_budget_are_an_error \
              words::arbitrary_rules::any_rule_text_ends_quickly_in_ok_or_err
            cargo test -p ducat-format --test it --locked -- --exact --nocapture \
              props::format_takes_anything \
              props::parse_takes_anything
          done 2>&1 | tee budgets.log
      - name: worst of 5 runs
        run: |
          python3 - budgets.log <<'PY'
          import re, sys
          line = re.compile(r'budget (\S+) (\S+) used ([0-9.]+) of ([0-9]+) \(([0-9.]+)%\)')
          worst, runs = {}, {}
          for text in open(sys.argv[1]):
              for test, case, used, budget, pct in line.findall(text):
                  runs[test] = runs.get(test, 0) + 1
                  if test not in worst or float(used) > worst[test][1]:
                      worst[test] = (case, float(used), int(budget), float(pct))
          if len(worst) != 5 or any(count != 5 for count in runs.values()):
              sys.exit(f'expected 5 tests with 5 runs each, got {runs}')
          rows = sorted(worst.items(), key=lambda item: -item[1][3])
          width = max(len(test) for test in worst)
          print(f'{"test":<{width}}  {"worst used ms":>13}  {"budget ms":>9}  {"pct":>7}  worst case')
          for test, (case, used, budget, pct) in rows:
              print(f'{test:<{width}}  {used:>13.1f}  {budget:>9}  {pct:>6.2f}%  {case}')
          PY
