name: Rust

# The Rust port in rust/, checked against the conformance suite in spec/ and the data in data/.
on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'spec/**'
      - 'data/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'spec/**'
      - 'data/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # the conformance runner (tests/it/spec.rs) prints its counts per area and operation; ducat-words
      # runs the words area, which the core runner delegates to it
      # ducat-benches (rust/benches) is excluded from every --workspace command: its competitors and
      # criterion must not unify features with what the libraries are tested and documented with,
      # and CI never runs the benchmarks. The lint job checks it once.
      - run: cargo test --workspace --exclude ducat-benches --locked --no-fail-fast -- --nocapture
      # every language, for the locale and ICU-behaviour tests that need pa, uz, sr and my
      - run: cargo test -p ducat-format --locked --no-fail-fast --features full -- --nocapture
      # ducat-words' CLDR currency names (not a default feature)
      - run: cargo test -p ducat-words --locked --no-fail-fast --features cldr-names
      # ducat::testing: the strategies' coverage, the assertion macros and their doc examples
      - run: cargo test -p ducat --locked --no-fail-fast --features proptest
      # ducat-fetch's sans-IO core without ureq (the README's doc examples need ureq); its live
      # smoke test is #[ignore]d: CI makes no requests
      - run: cargo test -p ducat-fetch --locked --no-fail-fast --no-default-features --lib --tests
      # ducat-sqlx and ducat-diesel with every database: SQLite runs in memory; Postgres and MySQL
      # skip here (the sql-databases job runs them against servers)
      - run: cargo test -p ducat-sqlx --locked --no-fail-fast --all-features
      - run: cargo test -p ducat-diesel --locked --no-fail-fast --all-features

  sql-databases:
    name: ducat-sqlx and ducat-diesel on Postgres and MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # the same servers and settings as ci.yml's TypeScript database tests
    services:
      postgres:
        # pinned by digest (postgres 18.6); update the tag and digest together, and in ci.yml
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: ducat
          POSTGRES_DB: ducat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        # pinned by digest (mysql 8.4.13); update the tag and digest together, and in ci.yml
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: ducat
          MYSQL_DATABASE: ducat
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pducat" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DUCAT_PG_URL: postgres://postgres:ducat@127.0.0.1:5432/ducat
      DUCAT_MYSQL_URL: mysql://root:ducat@127.0.0.1:3306/ducat
      # a lost URL fails the job instead of skipping the tests
      DUCAT_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: 'cargo test -p ducat-sqlx --locked --no-fail-fast --all-features --test it -- --nocapture postgres:: mysql::'
      # through diesel-async's pure Rust connections (no libpq or libmysqlclient)
      - run: 'cargo test -p ducat-diesel --locked --no-fail-fast --all-features --test it -- --nocapture postgres:: mysql::'

  format-features:
    name: ducat-format, one language and root only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test -p ducat-format --locked --no-fail-fast --no-default-features --features en
      - run: cargo test -p ducat-format --locked --no-fail-fast --no-default-features

  format-build:
    name: ducat-format build time and memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # the dependencies first, so the timed builds are ducat-format's own
      - run: cargo build -p ducat --release --locked --no-default-features --features territories
      - name: default languages
        run: |
          /usr/bin/time -v cargo build -p ducat-format --release --locked 2> time.txt
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' time.txt
      - name: every language (full)
        run: |
          /usr/bin/time -v cargo build -p ducat-format --release --locked --features full 2> time.txt
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' time.txt

  msrv:
    name: MSRV 1.85 (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85 --profile minimal
      # the tests' dev-dependencies (proptest) need a newer Rust; the MSRV is the library's, without
      # the proptest feature (proptest needs 1.88)
      - run: cargo +1.85 check -p ducat --lib --locked
      - run: cargo +1.85 check -p ducat --lib --locked --no-default-features
      - run: cargo +1.85 check -p ducat-words --lib --locked
      - run: cargo +1.85 check -p ducat-words --lib --locked --no-default-features
      - run: cargo +1.85 check -p ducat-words --lib --locked --features cldr-names
      - run: cargo +1.85 check -p ducat-format --lib --locked
      - run: cargo +1.85 check -p ducat-format --lib --locked --no-default-features
      # ureq 3, ureq-proto and zeroize declare 1.85; rustls, ring and webpki-roots less
      - run: cargo +1.85 check -p ducat-fetch --lib --locked
      - run: cargo +1.85 check -p ducat-fetch --lib --locked --no-default-features
      # ducat-sql-core, shared by ducat-sqlx and ducat-diesel, needs only ducat
      - run: cargo +1.85 check -p ducat-sql-core --lib --locked
      # sqlx 0.8.6 and its dependencies need 1.85 at most, so ducat-sqlx keeps the workspace's MSRV
      - run: cargo +1.85 check -p ducat-sqlx --lib --locked
      - run: cargo +1.85 check -p ducat-sqlx --lib --locked --no-default-features
      - run: cargo +1.85 check -p ducat-sqlx --lib --locked --all-features
      # diesel 2.2.12 needs 1.78 (2.3 needs 1.86, so the lockfile stays on 2.2), so ducat-diesel keeps
      # the workspace's MSRV
      - run: cargo +1.85 check -p ducat-diesel --lib --locked
      - run: cargo +1.85 check -p ducat-diesel --lib --locked --no-default-features
      - run: cargo +1.85 check -p ducat-diesel --lib --locked --all-features

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf && rustup default stable
      - run: cargo build -p ducat --lib --locked --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features iso,serde,allocate,cash --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features convert,serde,finance --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features ecb,boc,fed,boe,hmrc,history,stripe-fx,adyen-fx --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features wire,serde --target thumbv7em-none-eabihf
      - run: cargo build -p ducat-words --lib --locked --no-default-features --features en,de,fr,es,it,nl,pt,cldr-names --target thumbv7em-none-eabihf
      - run: cargo build -p ducat-format --lib --locked --no-default-features --features en --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features cash,policy,currencies,historic,territories,crypto,stripe,adyen,checkout,paypal,braintree,klarna --target thumbv7em-none-eabihf

  lint:
    name: fmt, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude ducat-benches --all-targets --all-features --locked -- -D warnings
      # the benchmarks compile and lint clean; they are never run in CI
      - run: cargo clippy -p ducat-benches --benches --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features finance --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features convert --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features convert,serde --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features ecb --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features history --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features boc --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features fed --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features boe --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features hmrc --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features stripe-fx --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features adyen-fx --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features wire --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features wire,serde --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features policy --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features pricing --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features math --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features cash --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features currencies --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features historic --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features territories --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features crypto --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features stripe --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features adyen --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features checkout --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features paypal --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features braintree --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features klarna --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features proptest --locked -- -D warnings
      - run: cargo clippy -p ducat --all-targets --features proptest --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features en --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features de --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features fr --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features es --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features it --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features nl --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features pt --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features cldr-names --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features cldr-names,en --locked -- -D warnings
      - run: cargo clippy -p ducat-format --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat-format --lib --no-default-features --features en --locked -- -D warnings
      - run: cargo clippy -p ducat-format --all-targets --locked -- -D warnings
      - run: cargo clippy -p ducat-fetch --all-targets --locked -- -D warnings
      - run: cargo clippy -p ducat-fetch --all-targets --no-default-features --locked -- -D warnings
      # ducat-sqlx: no database, each database alone, and all of them
      - run: cargo clippy -p ducat-sqlx --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat-sqlx --all-targets --no-default-features --features postgres --locked -- -D warnings
      - run: cargo clippy -p ducat-sqlx --all-targets --no-default-features --features mysql --locked -- -D warnings
      - run: cargo clippy -p ducat-sqlx --all-targets --no-default-features --features sqlite --locked -- -D warnings
      - run: cargo clippy -p ducat-sqlx --all-targets --all-features --locked -- -D warnings
      # ducat-diesel: no database, each database alone, and all of them
      - run: cargo clippy -p ducat-diesel --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat-diesel --all-targets --no-default-features --features postgres --locked -- -D warnings
      - run: cargo clippy -p ducat-diesel --all-targets --no-default-features --features mysql --locked -- -D warnings
      - run: cargo clippy -p ducat-diesel --all-targets --no-default-features --features sqlite --locked -- -D warnings
      - run: cargo clippy -p ducat-diesel --all-targets --all-features --locked -- -D warnings
      - run: cargo doc -p ducat -p ducat-words -p ducat-format -p ducat-fetch -p ducat-sql-core -p ducat-sqlx -p ducat-diesel --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p ducat-sqlx --no-deps --locked --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p ducat-sqlx --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p ducat-diesel --no-deps --locked --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p ducat-diesel --no-deps --locked --no-default-features --features mysql
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p ducat-diesel --no-deps --locked --no-default-features --features sqlite
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p ducat-diesel --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # intra-doc links to feature-gated items must resolve with every feature and with none
      - run: cargo doc --workspace --exclude ducat-benches --no-deps --locked --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      # in the workspace build ducat-format enables ducat's territories feature (feature
      # unification), so ducat's own no-default-features docs need a build of their own
      - run: cargo doc -p ducat --no-deps --locked --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --exclude ducat-benches --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings
