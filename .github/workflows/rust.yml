name: Rust

# The Rust port in rust/, checked against the conformance suite in spec/ and the data in data/.
on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'spec/**'
      - 'data/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'spec/**'
      - 'data/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # the conformance runner (tests/it/spec.rs) prints its counts per area and operation; ducat-words
      # runs the words area, which the core runner delegates to it
      - run: cargo test --workspace --locked --no-fail-fast -- --nocapture
      # every language, for the locale and ICU-behaviour tests that need pa, uz, sr and my
      - run: cargo test -p ducat-format --locked --no-fail-fast --features full -- --nocapture
      # ducat::testing: the strategies' coverage, the assertion macros and their doc examples
      - run: cargo test -p ducat --locked --no-fail-fast --features proptest

  format-features:
    name: ducat-format, one language and root only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test -p ducat-format --locked --no-fail-fast --no-default-features --features en
      - run: cargo test -p ducat-format --locked --no-fail-fast --no-default-features

  format-build:
    name: ducat-format build time and memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # the dependencies first, so the timed builds are ducat-format's own
      - run: cargo build -p ducat --release --locked --no-default-features --features territories
      - name: default languages
        run: |
          /usr/bin/time -v cargo build -p ducat-format --release --locked 2> time.txt
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' time.txt
      - name: every language (full)
        run: |
          /usr/bin/time -v cargo build -p ducat-format --release --locked --features full 2> time.txt
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' time.txt

  msrv:
    name: MSRV 1.85 (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85 --profile minimal
      # the tests' dev-dependencies (proptest) need a newer Rust; the MSRV is the library's, without
      # the proptest feature (proptest needs 1.88)
      - run: cargo +1.85 check -p ducat --lib --locked
      - run: cargo +1.85 check -p ducat --lib --locked --no-default-features
      - run: cargo +1.85 check -p ducat-words --lib --locked
      - run: cargo +1.85 check -p ducat-words --lib --locked --no-default-features
      - run: cargo +1.85 check -p ducat-format --lib --locked
      - run: cargo +1.85 check -p ducat-format --lib --locked --no-default-features

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf && rustup default stable
      - run: cargo build -p ducat --lib --locked --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features iso,serde,allocate,cash --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features convert,serde,finance --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features ecb,boc,fed,boe,hmrc,history,stripe-fx,adyen-fx --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features wire,serde --target thumbv7em-none-eabihf
      - run: cargo build -p ducat-words --lib --locked --no-default-features --features en,de,fr,es,it,nl,pt --target thumbv7em-none-eabihf
      - run: cargo build -p ducat-format --lib --locked --no-default-features --features en --target thumbv7em-none-eabihf
      - run: cargo build -p ducat --lib --locked --no-default-features --features cash,policy,currencies,historic,territories,crypto,stripe,adyen,checkout,paypal,braintree,klarna --target thumbv7em-none-eabihf

  lint:
    name: fmt, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features finance --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features convert --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features convert,serde --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features ecb --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features history --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features boc --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features fed --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features boe --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features hmrc --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features stripe-fx --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features adyen-fx --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features wire --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features wire,serde --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features policy --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features pricing --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features math --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features cash --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features currencies --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features historic --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features territories --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features crypto --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features stripe --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features adyen --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features checkout --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features paypal --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features braintree --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features klarna --locked -- -D warnings
      - run: cargo clippy -p ducat --lib --no-default-features --features proptest --locked -- -D warnings
      - run: cargo clippy -p ducat --all-targets --features proptest --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features en --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features de --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features fr --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features es --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features it --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features nl --locked -- -D warnings
      - run: cargo clippy -p ducat-words --lib --no-default-features --features pt --locked -- -D warnings
      - run: cargo clippy -p ducat-format --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p ducat-format --lib --no-default-features --features en --locked -- -D warnings
      - run: cargo clippy -p ducat-format --all-targets --locked -- -D warnings
      - run: cargo doc -p ducat -p ducat-words -p ducat-format --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
