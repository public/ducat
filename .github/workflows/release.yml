# Stages a release on npm when a v* tag is pushed, through npm trusted publishing (OIDC): no token or
# secret is involved. The staged version goes live only after a maintainer approves it on npmjs.com.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment, which only allows v* tags.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Staged publishing needs npm 11.15.0 or later. Pinned, so a release never depends on the npm
      # that happens to ship with Node.
      - run: npm install --global npm@11.21.2

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # Prereleases (1.0.0-beta.1) need an explicit dist-tag; everything else is tagged latest.
      # The publish step is the npm CLI: trusted and staged publishing are npm features.
      - name: Stage the release on npm
        run: |
          version=$(node -p "require('./package.json').version")
          # A patch to an older line (0.2.x after 0.3.0) must not take `latest` from the newer line:
          # it gets `latest-<major>.<minor>` instead.
          current=$(npm view @ducatjs/money dist-tags.latest 2>/dev/null || echo 0.0.0)
          newer=$(node -e '
            const parse = (v) => v.split("-")[0].split(".").map(Number);
            const [a, b] = [parse(process.argv[1]), parse(process.argv[2])];
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            console.log(cmp >= 0 ? "yes" : "no");
          ' "$version" "$current")
          case "$version" in
            *-*) dist_tag=next ;;
            *)
              if [ "$newer" = yes ]; then
                dist_tag=latest
              else
                dist_tag="latest-$(echo "$version" | cut -d. -f1,2)"
              fi
              ;;
          esac
          echo "staging $version as $dist_tag (npm latest is $current)"
          npm stage publish --provenance --access public --tag "$dist_tag"
