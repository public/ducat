<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">ducat</title>
  <!-- coin body, milled edge and inner ring -->
  <circle cx="64" cy="64" r="60" fill="#b8861b"/>
  <circle cx="64" cy="64" r="55" fill="#f0c348"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#a87a17" stroke-width="2.5" stroke-dasharray="2 3.2"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#a87a17" stroke-width="1.6"/>
  <!-- highlight -->
  <path d="M30 46 a38 38 0 0 1 30 -26" fill="none" stroke="#fff1bf" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- the D, as a coin legend letter -->
  <path d="M48 38 h14 c16 0 26 10 26 26 s-10 26 -26 26 h-14 z M58 47 v34 h4 c10 0 16 -7 16 -17 s-6 -17 -16 -17 z"
